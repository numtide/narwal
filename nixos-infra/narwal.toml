# Narwal Configuration File for the NixOS infrastructure.

[workarea]
# Local working directory for caching files and temporary data
path = "./work"

[s3]
# Primary S3 bucket for cache storage
bucket = "nix-cache"
region = "us-east-1"
use_ssl = true

[s3.credentials]
# AWS credentials - use profile or environment variables in production
profile = "nixos-archeologist"

[postgres]
# PostgreSQL connection for metadata storage
url = "postgres://narwal@localhost:5432/narwal?sslmode=disable"

[http]
# HTTP server configuration for upload interception
host = "127.0.0.1"
port = 7777

[inventory]
# Inventory bucket configuration for S3 bucket analysis
bucket = "nix-cache-inventory"
region = "us-east-1"
prefix = "nix-cache/nix-cache-inventory/"
use_ssl = true
report = "2025-06-07T01-00Z"

[inventory.credentials]
# Inventory-specific credentials (can differ from main S3)
profile = "nixos-archeologist"
